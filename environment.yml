name: eng-des-opt-course
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - pip:
      # Core (incl. SMT for lesson_04 surrogates) + all derivative backends (CasADi,
      # Warp, pymoo, pandas), the CSDL-alpha backend for the ex_05 C172 trim example,
      # and NASA's UQPCE for lesson_05 uncertainty quantification. Warp reaches an
      # NVIDIA GPU on native Windows via its bundled CUDA runtime; JAX stays CPU.
      - "-e .[trim,csdl,uq]"
