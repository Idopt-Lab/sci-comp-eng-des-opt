[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-comp-eng-des-opt"
version = "0.1.0"
description = "Aircraft sizing course examples for Scientific Computing Methods for Engineering Design Optimization."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy",
    "ambiance",
    "openmdao",
    "jax",
    "matplotlib",
    "pyXDSM",
    "streamlit",
]

[project.optional-dependencies]
# Extra derivative backends and the GA for the ex_05 C172 trim example.
# warp-lang's wheel ships the CUDA runtime + kernel toolchain, so it reaches an
# NVIDIA GPU on native Windows with just the driver (no CUDA toolkit / nvcc).
# Do NOT add jax[cuda]/jaxlib-cuda here -- unsupported on Windows; JAX stays CPU.
trim = [
    "casadi>=3.8.1",
    "warp-lang>=1.17",
    "pymoo>=0.6.2",
    "pandas",
]
# CSDL-alpha backend. Direct VCS reference (not published to PyPI); installed from
# source for editable/dev installs only.
csdl = [
    "csdl_alpha @ git+https://github.com/LSDOlab/CSDL_alpha.git",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aircraft_sizing = [
    "examples/**/*.md",
    "examples/**/*.pdf",
    "examples/**/*.png",
    "examples/**/*.pptx",
    "examples/**/*.tex",
    "examples/**/*.tikz",
    "examples/**/*.csv",
]
